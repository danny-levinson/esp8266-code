<script>
  function websend(s) {
	  console.log(s);
	  webSocket.send(s);
  }
  $( function() {
    $( "#tzone" ).spinner({min:-12, max:12});
    $( "#offset" ).spinner({min:-10, max:10});
    $( "#dst" ).checkboxradio();

    $( '#manualactive' ).click (function() { websend('/activatemanual') });
    $( '#autoactive' ).click (function() { websend('/activateauto') });
    $( '#opendamper' ).click (function() { websend('/opendamper') });
    $( '#closedamper' ).click (function() { websend('/closedamper') });
    
    $( '.ui-spinner-input' ).on ("change paste keyup blur", ( function(event) {
        //console.log( "event object:" );
        //console.log( event.currentTarget.id);
        //console.dir( event );
    	var v = $(this).spinner("value");
        if (v != this.oldval) {
        	this.oldval = v;
        	websend('/change?n='+event.currentTarget.id+'&v='+v);
        }
      }));
    $( ":checkbox" ).on ("change paste keyup blur", ( function(event) {
    	var v = $(this).is(":checked");
        if (v != this.oldval) {
        	this.oldval = v;
        	websend('/change?n='+event.currentTarget.id+'&v='+v);
        }
      }));
    $( ":radio" ).on ("change paste keyup blur", ( function(event) {
    	//console.dir($(this));
    	var rsetname = $(this)[0].name;
    	var rset = $("#"+rsetname);
    	var selname = $("input[name="+rsetname+"]:checked").val()
       	var v = $(this).is(":checked");			// always true!
        if (selname != rset.oldval) {
        	rset.oldval = selname;
       		websend('/change?n='+event.currentTarget.id+'&v='+v+"&t=radio");
        }
      }));
    // for some reason we don't seem to able to use $("dpattern" "pattern") here.
    $( "#dpattern" ).on ("selectmenuchange", ( function(event) {
        //console.log( "event object: "+ event.currentTarget.id +" <= " +event.currentTarget.value);
        //console.dir( event );
    	var v = event.currentTarget.value;
        if (v != this.oldval) {
        	this.oldval = v;
        	websend('/change?n='+event.currentTarget.id+'&v='+v);
        }
      }));
    $( "#pattern" ).on ("selectmenuchange", ( function(event) {
        //console.log( "event object: "+ event.currentTarget.id +" <= " +event.currentTarget.value);
        //console.dir( event );
    	var v = event.currentTarget.value;
        if (v != this.oldval) {
        	this.oldval = v;
        	websend('/change?n='+event.currentTarget.id+'&v='+v);
        }       
      }));
	$( document ).tooltip({
    	show: { effect: "slideDown", duration: 400, delay: 1500 }
      });
	$( "#tttoggle" ).on ("change", ( function(event) {
		var v = $(this).is(":checked");
			$( document ).tooltip(v ? 'enable' : 'disable');
	  }));
  } );
  $( function() {
	    $( "#tabs" ).tabs();
	  } );
  //$( '.ui-tabs-active' ).css('color', '#80ced6');
  </script>

<div id='loading_wrap' style='position:fixed; height:100%; width:100%;

<script>
$.switcher();
</script>

<script>																																								
	<!-- Adding a websocket to the client (webpage) -->
	var webSocket;

	function timerUpdate() {
		webSocket.send('/updatetime');
	}
	function activatemanual() {
		document.getElementById('mantabfdbck').innerHTML = 'Manual';
		document.getElementById('auttabfdbck').innerHTML = 'Manual';
		document.getElementById('manualactive').disabled = true;
		document.getElementById('autoactive').disabled = false;
		var open = document.getElementById('manstatefdbck').innerHTML == "Open";
		opendamper(open);
	}
	function activateautomatic() {
		document.getElementById('mantabfdbck').innerHTML = 'Automatic';
		document.getElementById('auttabfdbck').innerHTML = 'Automatic';				
		document.getElementById('manualactive').disabled = false;
		document.getElementById('autoactive').disabled = true;
		document.getElementById('opendamper').disabled = true;		
		document.getElementById('closedamper').disabled = true;		
	}
	function opendamper(open) {
		var aut = document.getElementById('mantabfdbck').innerHTML == 'Automatic';
		<!-- console.log('opendamper called with '+open+' '+aut+' '+(aut || !open)+' '+(aut || open)); -->
		document.getElementById('opendamper').disabled = aut || open;
		document.getElementById('closedamper').disabled = aut || ! open;
		document.getElementById('manstatefdbck').innerHTML = open ? "Open" : "Closed";
	}
	function init() {
		<!-- can't get ip address from js bom, so must do another mdns lookup to open websocket -->
		<!-- https://stackoverflow.com/questions/12600244/how-to-get-host-ip-and-port-number-on-which-the-application-is-running-using-jav -->
		webSocket = new WebSocket('ws://' + window.location.hostname + ':81/');
		webSocket.onopen = function() {
			document.getElementById('timenow').innerHTML = '888';
			setInterval(timerUpdate, 1000);           <!-- milliseconds -->
			websend('/initialise');
			if (navigator.userAgent.match(/(iPod|iPhone|iPad)/)) {
				$( document ).tooltip({ show: { delay: 200 } });
				$( document ).tooltip('disable');
			} else {
				$( "#tttoggle").prop("checked", "true");
				$(".ui-switcher").attr("aria-checked", "true");
			}
		}
		webSocket.onmessage = function(event) {
			var data = JSON.parse(event.data);
			if (data.hasOwnProperty('curTime')) {
				var curTime = data['curTime'];
				document.getElementById('timenow').innerHTML = curTime;
			} else if (data.hasOwnProperty('activatemanual')) {
				activatemanual();
			} else if (data.hasOwnProperty('activateauto')) {
				activateautomatic();
			} else if (data.hasOwnProperty('opendamper')) {
				opendamper(true);
			} else if (data.hasOwnProperty('closedamper')) {
				opendamper(false);
			} else if (data.hasOwnProperty('initData')) {
//				$("#tttoggle").checkboxradio("refresh");
				var initdata = data['initData'];
				for (let [key, value] of Object.entries(initdata)) {
					//console.log(`${key}: ${value}`);
					if (key == "manual") {				// special handling
						if (value == 1) activatemanual();
						else activateautomatic();
					} else if (key == "damperopen") {
						opendamper(value == 1);
					} else {
						var e = document.getElementById(key);
						//console.dir(e);
						if (e != null) {		// e.g. if gdata has never yet been saved?
							if (e.type == "text") {
								e.value = value;		// only works for spinners
							} else if (e.type == "checkbox" || e.type == "radio") {
								$("#"+key).prop("checked", value == 1 ? true : false);
								$("#"+key).checkboxradio("refresh");
								//console.dir(e);
							} else if (e.type == "select-one") {
								e.selectedIndex = value-1;			// as value is one-offset
								$("#"+key).selectmenu("refresh");
							}
						}
					}
				}
			    $('#loading_wrap').remove();

			} else {
				console.log('unrecognised websocket message');
			}
		}
	}

</script>
